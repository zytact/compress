[package]
name = "image-compress-wasm"
version = "1.0.0"
edition = "2021"
authors = ["zytact"]
license = "MIT"
description = "WebAssembly image compression and resizing library"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
