name: WASM

on:
    pull_request:
        paths:
            - 'wasm/**'
            - 'public/wasm/**'
            - '.github/workflows/wasm.yml'
    push:
        branches: [main]
        paths:
            - 'wasm/**'
            - 'public/wasm/**'
            - '.github/workflows/wasm.yml'

concurrency:
    group: wasm-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
    run:
        working-directory: wasm

jobs:
    check:
        name: Rust fmt, clippy and tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: Install pinned toolchain
              run: rustup toolchain install
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: wasm
            - name: Check formatting
              run: cargo fmt --check
            - name: Clippy
              run: cargo clippy --all-targets --target wasm32-unknown-unknown -- -D warnings
            - name: Test
              run: cargo test

    artifacts:
        name: Committed WASM is current
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: Install pinned toolchain
              run: rustup toolchain install
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: wasm
            - uses: pnpm/action-setup@v4
              with:
                  version: 11
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .node-version
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
              working-directory: .
            - run: pnpm build:wasm
              working-directory: .
            - name: Fail if public/wasm differs from a fresh build
              working-directory: .
              run: git diff --exit-code -- public/wasm
